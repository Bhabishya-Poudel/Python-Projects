<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; cursor: crosshair; }
  canvas { display: block; width: 100%; height: 100%; }
  #foot { position: absolute; left: 0; right: 0; bottom: 6px; display: flex;
          justify-content: space-between; align-items: center; padding: 0 4px; pointer-events: none; }
  #hint { color: #7d869c; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  #go { pointer-events: auto; cursor: pointer; border: 1px solid #5eead4; color: #5eead4;
        background: rgba(94, 234, 212, .08); font: 600 13px inherit; letter-spacing: .06em;
        padding: 9px 18px; border-radius: 999px; transition: background .2s, color .2s, transform .2s; }
  #go:hover { background: #5eead4; color: #0b0d12; transform: translateY(-2px); }
  @media (max-width: 560px) { #hint { display: none; } #foot { justify-content: center; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="The word INTERNSHIP drawn from many small copies of the word internship"></canvas>
  <div id="foot">
    <span id="hint">Move your cursor over the word. Click it if you dare</span>
    <button id="go" type="button">Find internships &darr;</button>
  </div>
</div>

<script>
(function () {
  var WORD = "internship", TEXT = "INTERNSHIP";
  var CW = 5, CH = 8;                        // one small letter per CW x CH px cell
  var BASE = [125, 138, 170], ACCENT = [94, 234, 212];
  var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var W = 0, H = 0, cells = [], fonts = {};
  var tx = -9999, ty = -9999, mx = -9999, my = -9999, hovering = false;
  var ripple = null, t0 = performance.now();

  function font(px) {
    return fonts[px] || (fonts[px] = px + "px ui-monospace, Menlo, Consolas, monospace");
  }

  // Draw the big word on a hidden canvas, then turn every "on" pixel position into one
  // small letter of the word "internship" (the word restarts at each edge of a big letter).
  function build() {
    W = wrap.clientWidth; H = wrap.clientHeight;
    if (!W || !H) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var m = document.createElement("canvas"); m.width = W; m.height = H;
    var mc = m.getContext("2d");
    var face = '"Arial Black", Impact, "Helvetica Neue", Arial, sans-serif';
    mc.font = "900 100px " + face;
    var fs = 100 * (W * 0.93) / mc.measureText(TEXT).width;
    mc.font = "900 " + fs + "px " + face;
    var ascent = mc.measureText("H").actualBoundingBoxAscent || fs * 0.72;
    var ky = Math.max(1, Math.min(2.6, (H * 0.74) / ascent));   // stretch tall on short, wide screens

    mc.fillStyle = "#000"; mc.textAlign = "center"; mc.textBaseline = "alphabetic";
    mc.translate(W / 2, H * 0.45 + (ascent * ky) / 2);
    mc.scale(1, ky);
    mc.fillText(TEXT, 0, 0);
    mc.lineJoin = "round"; mc.lineWidth = fs * 0.05; mc.strokeStyle = "#000"; mc.strokeText(TEXT, 0, 0);  // thicken strokes
    var data = mc.getImageData(0, 0, W, H).data;

    cells = [];
    var cols = Math.floor(W / CW), rows = Math.floor(H / CH);
    for (var r = 0; r < rows; r++) {
      var y = r * CH + CH / 2, run = 0;
      for (var c = 0; c < cols; c++) {
        var x = c * CW + CW / 2;
        if (data[((y | 0) * W + (x | 0)) * 4 + 3] > 128) {
          cells.push({ x: x, y: y, ch: WORD.charAt(run % WORD.length) });
          run++;
        } else { run = 0; }
      }
    }
    if (reduced) draw(performance.now());
  }

  function draw(now) {
    var t = (now - t0) / 1000;
    if (!hovering) {                          // idle: a spotlight sweeps across the word
      tx = W * (0.5 + 0.46 * Math.sin(t * 0.7)); ty = H * 0.5;
    }
    mx += (tx - mx) * 0.14; my += (ty - my) * 0.14;

    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    var R = Math.min(150, W * 0.18), ringAge = ripple ? (now - ripple.t) / 1000 : 99;
    if (ringAge > 1.4) ripple = null;
    var lastPx = 8; ctx.font = font(8);

    for (var i = 0; i < cells.length; i++) {
      var c = cells[i], dx = c.x - mx, dy = c.y - my, d = Math.sqrt(dx * dx + dy * dy);
      var k = d < R ? 1 - d / R : 0; k = k * k * (3 - 2 * k);
      if (ripple) {
        var rx = c.x - ripple.x, ry = c.y - ripple.y, rd = Math.sqrt(rx * rx + ry * ry);
        var off = rd - ringAge * 520;
        k = Math.max(k, Math.exp(-(off * off) / 1800) * (1 - ringAge / 1.4));
      }
      var shimmer = 0.5 + 0.5 * Math.sin(t * 1.5 + c.x * 0.011 + c.y * 0.02);
      var a = 0.50 + 0.22 * shimmer + 0.28 * k;
      var rC = BASE[0] + (ACCENT[0] - BASE[0]) * k,
          gC = BASE[1] + (ACCENT[1] - BASE[1]) * k,
          bC = BASE[2] + (ACCENT[2] - BASE[2]) * k;
      var px = 8 + Math.round(8 * k);
      if (px !== lastPx) { ctx.font = font(px); lastPx = px; }
      var push = d > 0.01 ? k * 9 / d : 0;   // letters near the cursor are pushed slightly outward
      ctx.fillStyle = "rgba(" + (rC | 0) + "," + (gC | 0) + "," + (bC | 0) + "," + a.toFixed(2) + ")";
      ctx.fillText(c.ch, c.x + dx * push, c.y + dy * push);
    }
    if (!reduced) requestAnimationFrame(draw);
  }

  var RICKROLL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

  // Opens the Rick Roll in a new browser tab. Must run inside the click handler so the
  // browser treats it as user-initiated. (The "noopener" flag is avoided because it makes
  // window.open always return null, hiding whether it worked; opener is cleared afterwards.)
  function rickroll() {
    var tab = window.open(RICKROLL, "_blank");
    if (tab) {
      try { tab.opener = null; } catch (err) { /* cross-origin already */ }
      return;
    }
    // Blocked or sandboxed: fall back to a plain link click, which a browser treats as a normal new-tab link.
    var link = document.createElement("a");
    link.href = RICKROLL; link.target = "_blank"; link.rel = "noopener noreferrer";
    document.body.appendChild(link); link.click(); link.remove();
  }

  function point(e) {
    var b = wrap.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
    tx = p.clientX - b.left; ty = p.clientY - b.top; hovering = true;
  }
  wrap.addEventListener("mousemove", point);
  wrap.addEventListener("touchmove", point, { passive: true });
  wrap.addEventListener("mouseleave", function () { hovering = false; });
  wrap.addEventListener("touchend", function () { hovering = false; });
  wrap.addEventListener("mousedown", function (e) {
    var b = wrap.getBoundingClientRect(); ripple = { x: e.clientX - b.left, y: e.clientY - b.top, t: performance.now() };
  });

  wrap.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("#go")) return;   // the scroll button is not the surprise
    rickroll();
  });

  document.getElementById("go").addEventListener("click", function () {
    try {
      var el = parent.document.getElementById("find-internships");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (err) { /* embedded somewhere that blocks access to the parent page: ignore */ }
  });

  if (window.ResizeObserver) new ResizeObserver(build).observe(wrap); else window.addEventListener("resize", build);
  build();
  if (!reduced) requestAnimationFrame(draw);
})();
</script>
</body>
</html>
